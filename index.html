<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassGen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>PassGen</h1>
      <p data-i18n="subtitle">Công cụ tạo và kiểm tra độ mạnh mật khẩu</p>
    </div>
    <div class="header-action">
      <button id="langBtn">EN / VI</button><br>
      <button id="themeBtn">🌙</button>
    </div>
  </header>
  <main class="main-content">

    <section class="generator">
      <div class="output-row">
        <input id="password" type="text" readonly>
        <button id="copyBtn" title="Sao chép">Sao chép</button>
      </div>
      <div class="meter"><div id="meterBar"></div></div>
      <p id="strengthText"></p>

      <label><span data-i18n="lengthLabel">Độ dài</span>: <span id="lengthValue">16</span></label>
      <input id="length" type="range" min="8" max="64" value="16">

      <label><input id="lower" type="checkbox" checked> <span data-i18n="lower">Chữ thường (a-z)</span></label>
      <label><input id="upper" type="checkbox" checked> <span data-i18n="upper">Chữ hoa (A-Z)</span></label>
      <label><input id="digits" type="checkbox" checked> <span data-i18n="digits">Số (0-9)</span></label>
      <label><input id="symbols" type="checkbox" checked> <span data-i18n="symbols">Ký tự đặc biệt</span></label>

      <button id="generateBtn">Tạo mật khẩu mới</button>
    </section>
    
  <section class="checker">
      <h2 data-i18n="checkTitle">Kiểm tra mật khẩu của bạn</h2>
      <input id="checkInput" type="text" placeholder="Nhập mật khẩu để kiểm tra">
      <p id="checkResult"></p>
      <ul id="suggestions"></ul>
    </section>

    <section class="history">
      <h2 data-i18n="historyTitle">Lịch sử (tối đa 100 mật khẩu)</h2>
      <ul id="historyList"></ul>
    </section>
  </main>

  <footer class="footer">
        © 2026 PassGen - Tran Lam Dang Quang - CC25TT - 25TH2519
  </footer>

  <script src="script.js"></script>
</body>
</html>

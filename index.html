<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassGen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>PassGen</h1>
      <p data-i18n="subtitle">Công cụ tạo và kiểm tra độ mạnh mật khẩu</p>
    </div>
    <div class="header-action">
      <button id="langBtn">EN / VI</button><br>
      <button id="themeBtn">🌙</button>
    </div>
  </header>
  <main class="main-content">

    <section class="generator">
      <div class="output-row">
        <div id="passwordDisplay" class="pw-display" tabindex="0"></div>
        <button id="copyBtn" title="Sao chép">Sao chép</button>
      </div>
      <div class="meter"><div id="meterBar"></div></div>
      <p id="strengthText"></p>
      <p id="crackGen" class="crack"></p>

      <div class="length-control">
        <div class="length-header">
          <label for="lengthInput" data-i18n="lengthLabel">Độ dài</label>
          <div class="length-stepper">
            <button id="decLengthBtn" type="button" title="Giảm độ dài">−</button>
            <input id="lengthInput" type="number" min="8" max="64" value="16">
            <button id="incLengthBtn" type="button" title="Tăng độ dài">+</button>
          </div>
        </div>
        <input id="length" type="range" min="8" max="64" value="16">
      </div>

      <label><input id="lower" type="checkbox" checked> <span data-i18n="lower">Chữ thường (a-z)</span></label>
      <label><input id="upper" type="checkbox" checked> <span data-i18n="upper">Chữ hoa (A-Z)</span></label>
      <label><input id="digits" type="checkbox" checked> <span data-i18n="digits">Số (0-9)</span></label>
      <label><input id="symbols" type="checkbox" checked> <span data-i18n="symbols">Ký tự đặc biệt</span></label>
      <label><input id="colorize" type="checkbox" checked> <span data-i18n="colorize">Tô màu phân loại ký tự</span></label>

      <button id="generateBtn">Tạo mật khẩu mới</button>
    </section>

    <section class="checker">
      <h2 data-i18n="checkTitle">Kiểm tra mật khẩu của bạn</h2>
      <div class="output-row">
        <input id="checkInput" type="password" autocomplete="off" placeholder="Nhập mật khẩu để kiểm tra">
        <button id="toggleCheckBtn" type="button" title="Hiện mật khẩu">👁</button>
      </div>
      <p id="checkResult"></p>
      <p id="crackCheck" class="crack"></p>
      <ul id="suggestions"></ul>
    </section>

    <section class="history">
      <div class="history-head">
        <h2 data-i18n="historyTitle">Lịch sử (tối đa 100 mật khẩu)</h2>
        <button id="clearHistoryBtn" type="button" data-i18n="clearHistory">Xóa lịch sử</button>
      </div>
      <ul id="historyList"></ul>
    </section>
  </main>

  <footer class="footer">
    © 2026 PassGen - Tran Lam Dang Quang - CC25TT - 25TH2519
  </footer>

  <script src="script.js"></script>
</body>
</html>
